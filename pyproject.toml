[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-simple-music"
version = "1.1.0"
description = "网易云与QQ音乐搜索、卡片分享及播放链接"
requires-python = ">=3.10"
dependencies = ["nonebot2>=2.3,<3", "aiohttp>=3.10,<4"]
license = {text = "MIT"}
authors = [{name = "Akavilos"}]
readme = "README.md"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_simple_music*"]

[tool.setuptools.package-data]
"nonebot_plugin_simple_music.music_core" = ["LICENSE"]
